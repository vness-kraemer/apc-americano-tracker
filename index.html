<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>APC Americano Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F4F6;
    --surface:#FFFFFF;
    --ink:#0B1420;
    --ink-soft:#5B6472;
    --court:#020F23;
    --court-dark:#000810;
    --ball:#FDBB0B;
    --ball-dark:#9C7207;
    --team-b:#FDBB0B;
    --line:#E1E5E9;
    --danger:#C1502F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Montserrat', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1180px; margin:0 auto; padding:20px 16px 80px;}

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:22px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .brand-logo{height:42px; width:auto; display:block;}
  .brand .sub{
    font-size:12.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    border-left:2px solid var(--line); padding-left:12px;
  }

  /* Buttons */
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    padding:12px 18px; font-weight:700; font-size:14.5px; transition:transform .08s ease, opacity .15s ease, background .15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--court); color:#fff;}
  .btn-primary:hover{background:var(--court-dark);}
  .btn-primary:disabled{background:#B7C3C8; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--court); border:2px solid var(--court);}
  .btn-ghost:hover{background:rgba(2,15,35,0.06);}
  .btn-danger-ghost{background:transparent; color:var(--danger); border:2px solid var(--danger); font-size:13px; padding:9px 14px;}

  /* Setup screen */
  .setup-card{
    background:var(--surface); border-radius:var(--radius); padding:28px;
    box-shadow:0 1px 3px rgba(20,40,50,0.08);
    max-width:640px; margin:0 auto;
  }
  .setup-card h1{
    font-family:'Montserrat', sans-serif; font-weight:800; font-size:28px; color:var(--court-dark);
    margin:0 0 6px;
  }
  .setup-card p.lead{color:var(--ink-soft); margin:0 0 22px; font-size:15px; line-height:1.5;}
  label.field-label{display:block; font-weight:700; font-size:13.5px; margin-bottom:8px; color:var(--ink);}

  .court-select-row{display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;}
  .court-btn{
    width:52px; height:52px; border-radius:10px; border:2px solid var(--line); background:#FAFCFB;
    font-family:'Montserrat', sans-serif; font-weight:800; font-size:19px; color:var(--ink); padding:0;
  }
  .court-btn.active{background:var(--court); border-color:var(--court); color:#fff;}
  .court-btn:hover:not(.active){border-color:var(--court);}

  textarea{
    width:100%; min-height:220px; border:1.5px solid var(--line); border-radius:10px;
    padding:14px; font-family:'Montserrat', sans-serif; font-size:15px; resize:vertical; line-height:1.6;
    background:#FAFCFB;
  }
  textarea:focus{outline:none; border-color:var(--court);}
  .count-pill{
    display:inline-block; margin-top:10px; font-size:13px; font-weight:700;
    padding:4px 10px; border-radius:20px; background:#EAF1EE; color:var(--ink-soft);
  }
  .count-pill.ok{background:#E4F3D6; color:#4C6B22;}
  .count-pill.warn{background:#FFF3D6; color:#8A6A0F;}
  .setup-hint{font-size:13px; color:var(--ink-soft); margin-top:14px; line-height:1.5;}

  /* Main tournament layout */
  .tour-grid{display:grid; grid-template-columns: 1fr 300px; gap:20px; align-items:start;}
  @media (max-width: 860px){ .tour-grid{grid-template-columns:1fr;} }

  .round-header{
    background:var(--court); color:#fff; border-radius:var(--radius);
    padding:18px 22px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:14px; margin-bottom:18px;
  }
  .round-header .rnum{font-family:'Montserrat', sans-serif; font-weight:800; font-size:26px;}
  .round-header .rsub{font-size:12.5px; opacity:0.85; font-weight:600;}
  .header-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
  .backup-toggle{background:rgba(255,255,255,0.16); color:#fff; padding:8px 12px; font-size:13px;}
  .backup-toggle:hover{background:rgba(255,255,255,0.28);}
  .backup-toggle.active{background:var(--ball); color:var(--court);}
  .backup-toggle.active:hover{background:var(--ball);}

  .swap-hint{
    background:#EAF1EE; border:1px solid #CFE0D8; color:var(--court-dark); border-radius:12px;
    padding:10px 16px; font-size:13.5px; margin-bottom:14px; font-weight:600;
  }
  .swap-target{cursor:default;}
  .swap-mode .swap-target{
    cursor:pointer; border-bottom:1.5px dashed var(--court); padding:1px 2px; border-radius:3px;
  }
  .swap-mode .swap-target:hover{background:rgba(2,15,35,0.06);}
  .swap-target.selected{
    background:var(--ball) !important; color:var(--court) !important; border-bottom-color:transparent;
  }
  @media (max-width: 640px){
    .round-header{padding:16px 18px;}
    .header-actions{width:100%; justify-content:center;}
  }

  .court-card{
    background:var(--surface); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px;
    box-shadow:0 1px 3px rgba(20,40,50,0.08);
  }
  .court-title{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:12px;}
  .score-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 0;}
  .score-row + .score-row{border-top:1px solid var(--line); margin-top:2px; padding-top:14px;}
  .team-info{flex:1; min-width:0;}
  .team-tag{
    display:inline-block; font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:6px;
    margin-bottom:6px;
  }
  .team-tag.a{background:var(--court); color:#fff;}
  .team-tag.b{background:var(--team-b); color:var(--court);}
  .team-names{font-size:16px; font-weight:700; line-height:1.35; overflow-wrap:break-word;}
  .score-input{
    width:64px; height:52px; text-align:center; font-family:'Montserrat', sans-serif; font-weight:800; font-size:24px;
    border:1.5px solid var(--line); border-radius:10px; background:#FAFCFB; flex-shrink:0;
  }
  .score-input:focus{outline:none; border-color:var(--court);}
  @media (max-width: 380px){
    .team-names{font-size:14.5px;}
    .score-input{width:56px; height:48px; font-size:21px;}
  }

  .resting-box{
    background:#FFF8E8; border:1px solid #F0DFAE; border-radius:12px; padding:12px 16px;
    font-size:13.5px; color:#7A5E1C; margin-bottom:18px;
  }
  .resting-box b{color:#5C4614;}
  .courts-reduced-note{
    background:#FDECEA; border:1px solid #F3C6BE; color:#8A2E1D; border-radius:12px; padding:10px 16px;
    font-size:13px; margin-bottom:14px;
  }

  .complete-row{display:flex; justify-content:space-between; align-items:center; margin:18px 0 6px; flex-wrap:wrap; gap:10px;}

  /* Leaderboard */
  .leaderboard{
    background:var(--surface); border-radius:var(--radius); padding:18px 18px 10px;
    box-shadow:0 1px 3px rgba(20,40,50,0.08); position:sticky; top:16px;
  }
  .leaderboard h2{
    font-family:'Montserrat', sans-serif; font-weight:800; font-size:18px; margin:0 0 12px; color:var(--court-dark);
    display:flex; align-items:center; gap:6px;
  }
  .lb-row{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:20px; font-weight:800; color:var(--ink-soft); font-size:13px;}
  .lb-row.first .lb-rank{color:var(--ball-dark);}
  .lb-name{flex:1; font-weight:700;}
  .lb-points{font-family:'Montserrat', sans-serif; font-weight:800; font-size:18px; color:var(--court-dark);}
  .lb-meta{font-size:11px; color:var(--ink-soft); font-weight:600;}

  /* History */
  .history{margin-top:26px;}
  .history h3{font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:0 0 10px;}
  .history-item{
    background:var(--surface); border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:13px;
    color:var(--ink-soft); box-shadow:0 1px 2px rgba(20,40,50,0.06);
  }
  .history-item b{color:var(--ink);}

  /* Finished screen */
  .finish-card{
    background:var(--surface); border-radius:var(--radius); padding:32px; text-align:center;
    max-width:520px; margin:40px auto 0; box-shadow:0 1px 3px rgba(20,40,50,0.08);
  }
  .finish-card .trophy{font-size:44px; margin-bottom:6px;}
  .finish-card h1{font-family:'Montserrat', sans-serif; font-weight:800; font-size:26px; margin:0 0 4px; color:var(--court-dark);}
  .finish-card .winner-name{font-size:24px; font-weight:800; margin:4px 0 20px;}
  .finish-list{text-align:left; margin-top:10px;}

  .footer-actions{display:flex; justify-content:center; margin-top:26px;}

  /* Backup panel */
  .backup-panel{
    background:var(--surface); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px;
    box-shadow:0 1px 3px rgba(20,40,50,0.08); border:1.5px dashed var(--line);
  }
  .backup-panel h3{font-family:'Montserrat', sans-serif; font-weight:800; font-size:16px; margin:0 0 6px; color:var(--court-dark);}
  .backup-panel p{font-size:13px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;}
  .backup-textarea{
    width:100%; min-height:70px; font-family:monospace; font-size:11px; color:var(--ink-soft);
    border:1.5px solid var(--line); border-radius:8px; padding:10px; background:#FAFCFB; resize:vertical;
  }
  .backup-actions{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center;}
  .backup-msg{font-size:12.5px; font-weight:700; color:#4C6B22; margin-left:4px;}
  .restore-toggle-link{
    background:none; border:none; color:var(--court); text-decoration:underline; font-size:13px; padding:0; font-weight:700;
  }
</style>
</head>

        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){ state = JSON.parse(raw); return; }
      }
    }catch(e){ /* no saved state, start fresh */ }
    state = null;
  }
  async function clearState(){
    try{
      if(hasClaudeStorage){ await window.storage.delete(STORAGE_KEY, false); }
      else { localStorage.removeItem(STORAGE_KEY); }
    }catch(e){}
  }

  // ---------- helpers ----------
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function partnerKey(i,j){ return i<j ? i+'-'+j : j+'-'+i; }

  function effectiveCourtsFor(numCourts, playerCount){
    return Math.max(1, Math.min(numCourts, Math.floor(playerCount/4)));
  }

  function pickResting(players, count){
    if(count <= 0) return [];
    const arr = players.map((p,i)=>({i, sitOuts:p.sitOuts}));
    arr.sort((a,b)=>a.sitOuts-b.sitOuts);
    const threshold = arr[count-1].sitOuts;
    const below = arr.filter(x=>x.sitOuts<threshold).map(x=>x.i);
    const at = shuffle(arr.filter(x=>x.sitOuts===threshold).map(x=>x.i));
    const needed = count - below.length;
    return below.concat(at.slice(0, needed));
  }

  function buildTeamsForGroup(group, partnerHistory){
    const options = [
      [[group[0],group[1]],[group[2],group[3]]],
      [[group[0],group[2]],[group[1],group[3]]],
      [[group[0],group[3]],[group[1],group[2]]]
    ];
    const shuffledOptions = shuffle(options);
    for(const opt of shuffledOptions){
      const [teamA, teamB] = opt;
      const aRepeat = partnerHistory.has(partnerKey(teamA[0], teamA[1]));
      const bRepeat = partnerHistory.has(partnerKey(teamB[0], teamB[1]));
      if(!aRepeat && !bRepeat) return opt;
    }
    return shuffledOptions[0];
  }

  function generateRound(){
    const courtsNow = effectiveCourtsFor(state.numCourts, state.players.length);
    const restingCount = state.players.length - courtsNow*4;
    const restingIdx = pickResting(state.players, restingCount);
    const restingSet = new Set(restingIdx);
    const playingIdx = shuffle(state.players.map((p,i)=>i).filter(i=>!restingSet.has(i)));

    const partnerHistory = new Set();
    state.history.forEach(r=>{
      r.courts.forEach(c=>{
        partnerHistory.add(partnerKey(c.teamA[0], c.teamA[1]));
        partnerHistory.add(partnerKey(c.teamB[0], c.teamB[1]));
      });
    });

    const groups = [];
    for(let g=0; g<courtsNow; g++){
      groups.push(playingIdx.slice(g*4, g*4+4));
    }

    const courts = groups.map((group)=>{
      const [teamA, teamB] = buildTeamsForGroup(group, partnerHistory);
      return { teamA, teamB, scoreA:null, scoreB:null };
    });

    restingIdx.forEach(i=>{ state.players[i].sitOuts += 1; });

    state.current = {
      roundNumber: state.round,
      courts,
      resting: restingIdx,
      effectiveCourts: courtsNow
    };
  }

  function playerName(i){ return state.players[i].name; }

  function allScoresEntered(){
    return state.current.courts.every(c => c.scoreA !== null && c.scoreB !== null);
  }

  // ---------- manual position swap (e.g. injury, partner request, late arrival) ----------
  function parseLocKey(key){
    if(key.charAt(0) === 'r') return { resting:true, restIdx: parseInt(key.slice(2),10) };
    const parts = key.split(':'); // c:courtIdx:team:slot
    return { resting:false, court: parseInt(parts[1],10), team: parts[2], slot: parseInt(parts[3],10) };
  }
  function getPlayerIndexAt(loc){
    if(loc.resting) return state.current.resting[loc.restIdx];
    const court = state.current.courts[loc.court];
    return (loc.team === 'A' ? court.teamA : court.teamB)[loc.slot];
  }
  function setPlayerIndexAt(loc, playerIdx){
    if(loc.resting){ state.current.resting[loc.restIdx] = playerIdx; return; }
    const court = state.current.courts[loc.court];
    const arr = loc.team === 'A' ? court.teamA : court.teamB;
    arr[loc.slot] = playerIdx;
  }

  window.toggleSwapMode = function(){
    ui.swapMode = !ui.swapMode;
    ui.swapSelection = null;
    render();
  };

  window.selectForSwap = function(key){
    if(!ui.swapMode) return;
    if(ui.swapSelection === null){
      ui.swapSelection = key;
      render();
      return;
    }
    if(ui.swapSelection === key){
      ui.swapSelection = null;
      render();
      return;
    }
    const locA = parseLocKey(ui.swapSelection);
    const locB = parseLocKey(key);
    const playerA = getPlayerIndexAt(locA);
    const playerB = getPlayerIndexAt(locB);
    setPlayerIndexAt(locA, playerB);
    setPlayerIndexAt(locB, playerA);
    // keep sitOuts accurate if the swap moves someone between "resting" and "playing"
    if(locA.resting && !locB.resting){
      state.players[playerA].sitOuts -= 1;
      state.players[playerB].sitOuts += 1;
    } else if(!locA.resting && locB.resting){
      state.players[playerB].sitOuts -= 1;
      state.players[playerA].sitOuts += 1;
    }
    ui.swapSelection = null;
    saveState();
    render();
  };

  window.selectCourts = function(n){
    ui.setupCourts = n;
    document.querySelectorAll('.court-btn').forEach(btn=>{

  function updateSetupHint(){
    const ta = document.getElementById('player-input');
    if(!ta) return;
    const names = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    const pill = document.getElementById('count-pill');
    const startBtn = document.getElementById('start-btn');
    const n = names.length;

    if(n === 0){
      pill.textContent = '0 Spieler:innen eingetragen';
      pill.className = 'count-pill';

      pill.textContent = n + ' Spieler:innen – mindestens ' + MIN_PLAYERS + ' nötig';
      pill.className = 'count-pill warn';
    } else {
      const eff = effectiveCourtsFor(ui.setupCourts, n);
      const restCount = n - eff*4;
      let msg = n + ' Spieler:innen · ' + eff + ' von ' + ui.setupCourts + ' Plätzen nutzbar pro Runde';
      if(restCount > 0) msg += ' · ' + restCount + ' pausieren jeweils';
      pill.textContent = msg;
      pill.className = 'count-pill' + (eff === ui.setupCourts ? ' ok' : ' warn');
    }
    if(startBtn) startBtn.disabled = n < MIN_PLAYERS;
  }

  // ---------- actions (exposed globally for inline handlers) ----------
  window.startTournament = function(){
    const ta = document.getElementById('player-input');
    const names = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(names.length < MIN_PLAYERS){ return; }
    state = {
      phase: 'tournament',
      round: 1,
      numCourts: ui.setupCourts,
      players: names.map(n=>({name:n, points:0, sitOuts:0, gamesPlayed:0})),
      history: [],
      current: null
    };
    generateRound();
    saveState();
    render();
    requestWakeLock();
  };

  window.setScore = function(courtIdx, team, value){
    const v = value === '' ? null : Math.max(0, Math.min(POINTS_TARGET, parseInt(value,10) || 0));
    const court = state.current.courts[courtIdx];
    if(team === 'A'){
      court.scoreA = v;
      court.scoreB = (v === null) ? null : (POINTS_TARGET - v);
    }else{
      court.scoreB = v;
      court.scoreA = (v === null) ? null : (POINTS_TARGET - v);
    }
    saveState();
    renderScoresOnly();
  };

  window.completeRound = function(){
    if(!allScoresEntered()) return;
    state.current.courts.forEach(c=>{
      [...c.teamA].forEach(i=>{ state.players[i].points += c.scoreA; state.players[i].gamesPlayed += 1; });
      [...c.teamB].forEach(i=>{ state.players[i].points += c.scoreB; state.players[i].gamesPlayed += 1; });
    });
    state.history.push(state.current);
    state.round += 1;
    generateRound();
    saveState();
    render();
  };

  window.undoLastRound = function(){
    if(state.history.length === 0) return;
    if(!confirm('Letzte abgeschlossene Runde (Runde ' + state.history[state.history.length-1].roundNumber + ') zurücknehmen? Die aktuelle, noch nicht abgeschlossene Runde geht dabei verloren und wird danach neu berechnet.')) return;

    // revert points/gamesPlayed from the last completed round
    const lastRound = state.history.pop();
    lastRound.courts.forEach(c=>{
      c.teamA.forEach(i=>{ state.players[i].points -= c.scoreA; state.players[i].gamesPlayed -= 1; });
      c.teamB.forEach(i=>{ state.players[i].points -= c.scoreB; state.players[i].gamesPlayed -= 1; });
    });

    // revert sitOuts caused by generating the current (now discarded) round
    if(state.current && state.current.resting){
      state.current.resting.forEach(i=>{ state.players[i].sitOuts -= 1; });
    }

    // restore the last round as the editable current round, scores intact so only the mistake needs fixing
    state.round = lastRound.roundNumber;
    state.current = lastRound;
    ui.swapMode = false;
    ui.swapSelection = null;
    saveState();
    render();
  };

  window.finishTournament = function(){
    state.phase = 'finished';
    releaseWakeLock();
    saveState();
    render();
  };

  window.resetAll = async function(){

    await clearState();

    render();

  window.copyBackupText = async function(){

      await navigator.clipboard.writeText(text);

      try{
        const ta = document.getElementById('backup-textarea');
        ta.select();
        document.execCommand('copy');

    ui.backupMsg = copied
      ? '✅ Kopiert – jetzt z. B. per WhatsApp an dich selbst schicken.'

  window.restoreFromText = function(textareaId){
    const val = document.getElementById(textareaId).value.trim();
    const legacyPrefix = 'APC-AMERICANO-BACKUP-V1:';
    let payload = null;
    if(val.startsWith(BACKUP_PREFIX)){
      payload = val.slice(BACKUP_PREFIX.length);
    } else if(val.startsWith(legacyPrefix)){
      payload = val.slice(legacyPrefix.length);
    } else {
      alert('Das sieht nicht nach einem gültigen APC-Backup-Text aus.');
      return;
    }
    try{
      const parsed = JSON.parse(payload);
      if(!parsed.players || !parsed.phase){ throw new Error('invalid'); }
      if(!parsed.numCourts){
        // legacy backup without court count - infer a sensible default
        parsed.numCourts = Math.max(1, Math.min(MAX_COURTS, Math.floor(parsed.players.length/4)) || 3);
      }
      state = parsed;
      ui.backupOpen = false;
      ui.setupRestoreOpen = false;
      saveState();
      render();
      if(state.phase === 'tournament'){ requestWakeLock(); }
    }catch(e){
      alert('Backup konnte nicht gelesen werden. Bitte den kompletten Text prüfen.');
    }
  };

  // ---------- wake lock (keep screen on during a tournament) ----------
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
      }
    }catch(e){ /* not supported or denied - fail silently, no UI clutter */ }
  }
  function releaseWakeLock(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
  }
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState === 'visible' && state && state.phase === 'tournament'){
      await requestWakeLock();
    }
  });

  // ---------- Instagram-ready result image ----------
  function loadImage(src){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }
  function spaceOut(str){ return str.split('').join('\u2009'); } // thin space for a light letter-spacing effect

  function fitFontSize(ctx, text, maxWidth, startPx, minPx, weight){
    let size = startPx;
    while(size > minPx){
      ctx.font = weight + ' ' + size + 'px Montserrat, sans-serif';
      if(ctx.measureText(text).width <= maxWidth) break;
      size -= 2;
    }
    return size;
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  async function buildShareCanvas(){
    const fontSpecs = ['800 44px Montserrat','700 28px Montserrat','700 30px Montserrat','800 44px Montserrat','600 28px Montserrat'];
    try{ await Promise.all(fontSpecs.map(f=>document.fonts.load(f))); }catch(e){ /* proceed with fallback font if loading fails */ }

    const logoImg = await loadImage(LOGO_SRC);
    const sorted = standings();
    const top3 = sorted.slice(0,3);

    const W = 1080, H = 1350;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // brand navy background
    ctx.fillStyle = '#020F23';
    ctx.fillRect(0,0,W,H);

    // white card behind the logo so it stays crisp on the navy background
    const cardW = 420, cardH = 190, cardX = (W-cardW)/2, cardY = 70;
    ctx.fillStyle = '#FFFFFF';
    roundRect(ctx, cardX, cardY, cardW, cardH, 26);
    ctx.fill();

    const logoH = 130;
    const logoW = logoImg.width * (logoH/logoImg.height);
    ctx.drawImage(logoImg, cardX + (cardW-logoW)/2, cardY + (cardH-logoH)/2, logoW, logoH);

    let y = cardY + cardH + 60;

    ctx.textAlign = 'center';
    ctx.font = '700 28px Montserrat, sans-serif';
    ctx.fillStyle = '#FDBB0B';
    ctx.fillText(spaceOut('TURNIER-ERGEBNIS'), W/2, y);

    y += 34;
    ctx.strokeStyle = 'rgba(253,187,11,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W/2 - 70, y);
    ctx.lineTo(W/2 + 70, y);
    ctx.stroke();

    // podium geometry: classic 2nd - 1st - 3rd arrangement
    const baseline = 930;
    const barW = 230, gap = 36;
    const totalW = barW*3 + gap*2;
    const startX = (W - totalW)/2;
    const columns = [
      { rank:1, x: startX + barW + gap, h: 310, medal:'🥇', fill:'#FDBB0B' },
      { rank:2, x: startX,               h: 225, medal:'🥈', fill:'#C9D0D6' },
      { rank:3, x: startX + (barW+gap)*2, h: 160, medal:'🥉', fill:'#C98A4B' }
    ];

    columns.forEach(col=>{
      const p = top3[col.rank-1];
      const barTop = baseline - col.h;
      if(!p) return;

      // medal
      ctx.textAlign = 'center';
      ctx.font = '64px sans-serif';
      ctx.fillText(col.medal, col.x + barW/2, barTop - 95);

      // name (fitted to column width)
      const nameSize = fitFontSize(ctx, p.name, barW + 30, 32, 20, '700');
      ctx.font = '700 ' + nameSize + 'px Montserrat, sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(p.name, col.x + barW/2, barTop - 34);

      // bar
      roundRect(ctx, col.x, barTop, barW, col.h, 14);
      ctx.fillStyle = col.fill;
      ctx.fill();

      // points inside the bar
      const pointsStr = String(p.points);
      const pointsSize = fitFontSize(ctx, pointsStr, barW - 30, 46, 26, '800');
      ctx.font = '800 ' + pointsSize + 'px Montserrat, sans-serif';
      ctx.fillStyle = '#020F23';
      ctx.fillText(pointsStr, col.x + barW/2, barTop + col.h/2 + pointsSize*0.35);
    });

    y = baseline + 68;
    ctx.textAlign = 'center';
    ctx.font = '600 28px Montserrat, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(`🎾 ${sorted.length} Spieler:innen · ${state.history.length} Runden gespielt`, W/2, y);

    y += 44;
    const dateStr = new Date().toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });
    ctx.font = '500 24px Montserrat, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(`📅 ${dateStr}`, W/2, y);

    ctx.strokeStyle = 'rgba(253,187,11,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W*0.3, H-140);
    ctx.lineTo(W*0.7, H-140);
    ctx.stroke();

    ctx.font = '600 24px Montserrat, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('Alsdorfer Padel Club · apc-alsdorf.de', W/2, H-98);

    return canvas;
  }

  }

  function renderTournament(){
    const ready = allScoresEntered();
    const reduced = state.current.effectiveCourts < state.numCourts;
    const restingSpans = state.current.resting.length
      ? state.current.resting.map((i,ri)=>nameSpan(i, 'r:'+ri)).join(', ')
      : '–';
    return `
      <div class="topbar">
        <div class="brand">
          <img class="brand-logo" src="${LOGO_SRC}" alt="APC Alsdorf Logo">
          <span class="sub">Americano Tracker</span>
        </div>
        <button class="btn-danger-ghost" onclick="resetAll()">Zurücksetzen</button>
      </div>

      <div class="round-header">
        <div>
          <div class="rnum">Runde ${state.round}</div>
          <div class="rsub">${state.players.length} Spieler:innen · ${state.current.effectiveCourts} Plätze aktiv · ${POINTS_TARGET}-Punkte-Matches</div>
        </div>
        <div class="header-actions">
          <button class="backup-toggle ${ui.swapMode?'active':''}" onclick="toggleSwapMode()">${ui.swapMode ? '✅ Fertig' : '🔀 Tauschen'}</button>
          <button class="backup-toggle" onclick="toggleBackupPanel()">💾 Sichern</button>
        </div>
      </div>

      ${ui.backupOpen ? renderBackupPanel() : ''}

      <div class="${ui.swapMode ? 'swap-mode' : ''}">
        <div class="tour-grid">
          <div>
            ${reduced ? `<div class="courts-reduced-note">Nur ${state.current.effectiveCourts} von ${state.numCourts} gewählten Plätzen aktiv – nicht genug Spieler:innen für mehr.</div>` : ''}
            ${ui.swapMode ? `<div class="swap-hint">🔀 Tippe zwei Namen an, um sie zu tauschen (z. B. bei Verletzung, Partner-Wunsch oder Zuspätkommer:in).</div>` : ''}
            <div class="resting-box">⏸️ Pause diese Runde: <b>${restingSpans}</b></div>
            ${state.current.courts.map((c,i)=>renderCourt(c,i)).join('')}

            <div class="complete-row">
              <button class="btn-primary" ${ready ? '' : 'disabled'} onclick="completeRound()">
                Runde ${state.round} abschließen &amp; nächste Runde starten
              </button>
              <div style="display:flex; gap:10px; flex-wrap:wrap;">
                ${state.history.length > 0 ? `<button class="btn-ghost" onclick="undoLastRound()">↩ Runde ${state.history[state.history.length-1].roundNumber} zurücknehmen</button>` : ''}
                <button class="btn-ghost" onclick="finishTournament()">Turnier beenden</button>
              </div>
            </div>

            ${renderHistory()}
          </div>
          <div>${renderLeaderboard()}</div>
        </div>
      </div>
    `;
  }

  function renderFinished(){
    const sorted = standings();
    const winner = sorted[0];
    return `
      <div class="finish-card">
        <img class="brand-logo" src="${LOGO_SRC}" alt="APC Alsdorf Logo" style="height:48px; margin-bottom:18px;">
        <div class="trophy">🏆</div>
        <h1>Turnier beendet</h1>
        <div class="winner-name">${escapeHtml(winner.name)}</div>
        <div style="color:var(--ink-soft); font-size:14px; margin-bottom:6px;">
          ${winner.points} Punkte aus ${winner.gamesPlayed} Matches
        </div>
        <div class="finish-list">
          ${sorted.map((p,rank)=>`
            <div class="lb-row ${rank===0?'first':''}">
              <div class="lb-rank">${rank+1}</div>
              <div class="lb-name">${escapeHtml(p.name)}</div>
              <div class="lb-points">${p.points}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="footer-actions" style="flex-direction:column; gap:10px;">
        <button class="btn-primary" id="sharepic-btn" onclick="downloadSharePic()">📸 Ergebnis-Bild für Instagram</button>
        <div style="font-size:12px; color:var(--ink-soft); text-align:center;">Öffnet in neuem Tab – dort Bild lange gedrückt halten &amp; speichern</div>
        <button class="btn-ghost" onclick="startNewTournament()">Neues Turnier starten</button>
      </div>
    `;
  }

  function renderSetup(){
    const courtButtons = [];
    for(let n=1; n<=MAX_COURTS; n++){
      courtButtons.push(`<button type="button" class="court-btn ${n===ui.setupCourts?'active':''}" data-n="${n}" onclick="selectCourts(${n})">${n}</button>`);
    }
    return `
      <div class="topbar">
        <div class="brand">
          <img class="brand-logo" src="${LOGO_SRC}" alt="APC Alsdorf Logo">
          <span class="sub">Americano Tracker</span>
        </div>
      </div>
      <div class="setup-card">
        <h1>Neues Turnier einrichten</h1>
        <p class="lead">Wählt zuerst, wie viele Plätze euch zur Verfügung stehen, dann tragt die Namen ein. Runden, Team-Zuteilung und Pausen werden danach automatisch und fair generiert – ${POINTS_TARGET} Punkte pro Match.</p>

        <label class="field-label">Anzahl Plätze</label>
        <div class="court-select-row">${courtButtons.join('')}</div>

        <label class="field-label">Namen der Spieler:innen (ein Name pro Zeile)</label>
        <textarea id="player-input" placeholder="Anna
Ben
Carla
..." oninput="updateSetupHint()"></textarea>
        <div><span class="count-pill" id="count-pill">0 Spieler:innen eingetragen</span></div>
        <div style="margin-top:22px;">
          <button class="btn-primary" id="start-btn" disabled onclick="startTournament()">Turnier starten</button>
        </div>
        <div class="setup-hint">Reicht die Spielerzahl nicht für alle gewählten Plätze, werden pro Runde automatisch weniger Plätze genutzt. Bei einer Spielerzahl, die nicht durch 4 teilbar ist, sitzen entsprechend viele Personen pro Runde aus – reihum, sodass jede:r ungefähr gleich oft pausiert.</div>

        <div style="margin-top:18px; border-top:1px solid var(--line); padding-top:14px;">
          <button class="restore-toggle-link" onclick="toggleSetupRestore()">
            ${ui.setupRestoreOpen ? 'Wiederherstellen ausblenden' : 'Läuft schon ein Turnier? Aus Backup wiederherstellen'}
          </button>
          ${ui.setupRestoreOpen ? `
            <textarea class="backup-textarea" id="setup-restore-textarea" style="margin-top:10px;" placeholder="APC-AMERICANO-BACKUP-V2:..."></textarea>
            <div class="backup-actions">
              <button class="btn-ghost" onclick="restoreFromText('setup-restore-textarea')">Wiederherstellen</button>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  function render(){
    const app = document.getElementById('app');
    if(!state || state.phase === 'setup' || !state.phase){
      app.innerHTML = renderSetup();
      updateSetupHint();
    } else if(state.phase === 'tournament'){
      app.innerHTML = renderTournament();
    } else if(state.phase === 'finished'){
      app.innerHTML = renderFinished();
    }
  }

  function renderScoresOnly(){
    const btnRow = document.querySelector('.complete-row .btn-primary');
    if(btnRow) btnRow.disabled = !allScoresEntered();
  }

  // ---------- init ----------
  (async function init(){
    await loadState();
    if(state && state.phase === 'tournament'){
      requestWakeLock();
    }
    render();
  })();

})();
</script>
</body>
</html>
